    // --- Web Audio API Chime (659Hz E5 -> 523Hz C5) ---
    function playWarmDoorbellChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();

        // 1st note: E5 (659.25Hz)
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(659.25, ctx.currentTime);
        gain1.gain.setValueAtTime(0.35, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(ctx.currentTime);
        osc1.stop(ctx.currentTime + 0.9);

        // 2nd note: C5 (523.25Hz)
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(523.25, ctx.currentTime + 0.35);
        gain2.gain.setValueAtTime(0.35, ctx.currentTime + 0.35);
        gain2.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.5);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(ctx.currentTime + 0.35);
        osc2.stop(ctx.currentTime + 1.5);
      } catch (err) {
        console.warn("Audio note played in silence:", err);
      }
    }

    // --- Main App Component ---
    function CravinglyApp() {
      const [metrics, setMetrics] = useState(() => {
        try {
          const stored = localStorage.getItem('cravingly_lifetime_metrics');
          return stored ? JSON.parse(stored) : { moneySaved: 2340, caloriesAvoided: 4890, ordersCompleted: 3 };
        } catch {
          return { moneySaved: 2340, caloriesAvoided: 4890, ordersCompleted: 3 };
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem('cravingly_lifetime_metrics', JSON.stringify(metrics));
        } catch {}
      }, [metrics]);

      const [activeCategory, setActiveCategory] = useState('All');
      const [customizingItem, setCustomizingItem] = useState(null);
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [deliveryNote, setDeliveryNote] = useState("Leave outside, ring the bell and do a happy dance");
      const [toastMsg, setToastMsg] = useState(null);

      // Tracking and Climax States
      const [isTracking, setIsTracking] = useState(false);
      const [trackingProgress, setTrackingProgress] = useState(0); // 0 -> 100
      const [speedMultiplier, setSpeedMultiplier] = useState(1);  // 1x, 2x, 5x, 10x
      const [showCelebration, setShowCelebration] = useState(false);
      const [lastOrderDetails, setLastOrderDetails] = useState(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3800);
      };

      const filteredFood = activeCategory === 'All'
        ? FOOD_MENU
        : FOOD_MENU.filter(item => item.category === activeCategory);

      const subtotal = cart.reduce((acc, item) => acc + (item.totalPrice * item.quantity), 0);
      const deliveryFee = cart.length > 0 ? 45 : 0;
      const platformFee = cart.length > 0 ? 10 : 0;
      const taxes = cart.length > 0 ? Math.round(subtotal * 0.05) : 0;
      const originalGrandTotal = subtotal + deliveryFee + platformFee + taxes;

      const handleAddCustomizedItem = (dishData) => {
        setCart(prev => {
          const idx = prev.findIndex(item => item.id === dishData.id && JSON.stringify(item.customs) === JSON.stringify(dishData.customs));
          if (idx > -1) {
            const copy = [...prev];
            copy[idx].quantity += 1;
            return copy;
          }
          return [...prev, { ...dishData, quantity: 1 }];
        });
        setCustomizingItem(null);
        showToast(`✨ Added "${dishData.name}" to your craving bag!`);
      };

      const handleUpdateQty = (index, delta) => {
        setCart(prev => {
          const copy = [...prev];
          copy[index].quantity += delta;
          if (copy[index].quantity <= 0) {
            return copy.filter((_, i) => i !== index);
          }
          return copy;
        });
      };

      const handlePlaceOrder = () => {
        if (cart.length === 0) return;
        setIsCartOpen(false);
        setIsTracking(true);
        setTrackingProgress(0);
        setSpeedMultiplier(1);
      };

      // 2-Minute (120-Second) Realistic Driver Progress Loop
      useEffect(() => {
        if (!isTracking) return;

        // Interval: every 100 milliseconds
        // In 120s, there are 1,200 intervals of 100ms.
        // Each interval increases progress by: (100 / 1200) * speedMultiplier = (1 / 12) * speedMultiplier
        const intervalTimeMs = 100;
        const progressIncrementPerInterval = (100 / (REAL_TIME_DURATION_SECONDS * 10)) * speedMultiplier;

        const timer = setInterval(() => {
          setTrackingProgress(prev => {
            const next = prev + progressIncrementPerInterval;
            if (next >= 100) {
              clearInterval(timer);
              triggerArrival();
              return 100;
            }
            return next;
          });
        }, intervalTimeMs);

        return () => clearInterval(timer);
      }, [isTracking, speedMultiplier]);

      const triggerArrival = () => {
        playWarmDoorbellChime();
        if (window.confetti) {
          window.confetti({
            particleCount: 160,
            spread: 90,
            origin: { y: 0.6 },
            colors: ['#FA5838', '#F5A623', '#3D7A5A', '#FF7D66', '#FFD166']
          });
        }

        const totalCalories = cart.reduce((sum, item) => sum + (item.calories * item.quantity), 0);
        const orderSummary = {
          savedAmount: originalGrandTotal,
          avoidedCalories: totalCalories || 850,
          totalItems: cart.reduce((s, i) => s + i.quantity, 0)
        };

        setMetrics(prev => ({
          moneySaved: prev.moneySaved + orderSummary.savedAmount,
          caloriesAvoided: prev.caloriesAvoided + orderSummary.avoidedCalories,
          ordersCompleted: prev.ordersCompleted + 1
        }));

        setLastOrderDetails(orderSummary);
        setShowCelebration(true);
        setIsTracking(false);
      };

      const handleResetOrder = () => {
        setShowCelebration(false);
        setCart([]);
        setTrackingProgress(0);
      };

      return (
        <div className="w-full max-w-md bg-white border border-[#EBE3D5] rounded-none sm:rounded-3xl shadow-pillowy-lg overflow-hidden flex flex-col min-h-screen sm:min-h-[890px] relative">

              </div>
              <div>
                <h1 className="text-base font-extrabold text-[#231A12] tracking-tight flex items-center gap-1.5 font-serif">

                </h1>
                <p className="text-[10px] text-[#7A6E63] font-medium">100% Dopamine • 0 Calories • ₹0 Spent</p>
              </div>
            </div>

            <div className="flex items-center gap-1.5">
              <div className="bg-white border border-[#E8DFC8] px-2.5 py-1 rounded-xl text-right shadow-sm">
                <p className="text-[8px] uppercase tracking-wider text-sage-600 font-extrabold">Saved</p>
                <p className="text-xs font-black text-emerald-600">₹{metrics.moneySaved}</p>
              </div>
              <div className="bg-white border border-[#E8DFC8] px-2.5 py-1 rounded-xl text-right shadow-sm">
                <p className="text-[8px] uppercase tracking-wider text-honey-600 font-extrabold">Avoided</p>
                <p className="text-xs font-black text-honey-600">{metrics.caloriesAvoided} kcal</p>
              </div>
            </div>
          </header>

          {/* Toast Notification */}
          {toastMsg && (
            <div className="absolute top-16 left-4 right-4 z-50 bg-[#2D251E] text-white text-xs px-4 py-3 rounded-2xl shadow-xl border border-white/10 flex items-center justify-between">
              <span className="font-medium">{toastMsg}</span>
              <button onClick={() => setToastMsg(null)} className="ml-2 text-stone-400 hover:text-white font-bold">✕</button>
            </div>
          )}

          <div className="p-3 bg-cream-100/60 border-b border-[#EBE3D5] flex gap-2 overflow-x-auto no-scrollbar">
            {['All', 'Real Indian', 'Fast Food', 'Cozy Dinner'].map(cat => (
              <button
                key={cat}
                onClick={() => setActiveCategory(cat)}
                className={`px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${
                  activeCategory === cat

                }`}
              >
                {cat === 'All' ? '🍽️ All Delights' : cat === 'Real Indian' ? '🍛 Real Indian' : cat === 'Fast Food' ? '🍔 Street & Sizzle' : '🍝 Cozy Dinner'}
              </button>
            ))}
          </div>

          {/* Food Menu Feed */}
          <div className="flex-1 overflow-y-auto p-4 space-y-4 pb-28">
            {filteredFood.map(dish => (

                key={dish.id}

              >
                <div className="relative h-48 w-full overflow-hidden bg-stone-100">
                  <img 
                    src={dish.image} 
                    alt={dish.name}
                    className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                  />
                  <div className="absolute top-3 left-3 flex gap-1.5">
                    <span className="bg-white/90 backdrop-blur-md text-[#231A12] text-[10px] font-extrabold px-2.5 py-1 rounded-full shadow-sm flex items-center gap-1">
                      <span className="text-honey-500">★</span> {dish.rating} ({dish.reviews})
                    </span>
                    <span className="bg-coral-500/90 backdrop-blur-md text-white text-[10px] font-bold px-2 py-1 rounded-full shadow-sm">
                      {dish.badge}
                    </span>
                  </div>
                  <div className="absolute bottom-3 left-3 bg-[#231A12]/80 backdrop-blur-md text-white text-[10px] font-semibold px-2.5 py-0.5 rounded-md flex items-center gap-1.5">
                    <span>⏱ {dish.prepTime}</span>
                    <span>•</span>
                    <span className="text-honey-400">🔥 {dish.calories} kcal</span>
                  </div>
                </div>

    // --- ENHANCED 2-MINUTE INTERACTIVE LIVE MAP TRACKER ---
    function EnhancedMapTracker({ progress, speed, setSpeed, showToast }) {
      const mapContainerRef = useRef(null);
      const leafletMapRef = useRef(null);
      const riderMarkerRef = useRef(null);
      const activePolylineRef = useRef(null);
      const completedPolylineRef = useRef(null);

      // Remaining Time & Distance Calculations
      const remainingSeconds = Math.max(0, Math.ceil(REAL_TIME_DURATION_SECONDS * (1 - progress / 100)));
      const minutes = Math.floor(remainingSeconds / 60);
      const seconds = remainingSeconds % 60;
      const formattedTime = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

      // Total distance ~2.8 km
      const totalKm = 2.8;
      const remainingKm = (totalKm * (1 - progress / 100));
      const distanceLabel = remainingKm > 0.4 ? `${remainingKm.toFixed(1)} km away` : `${Math.round(remainingKm * 1000)} meters away`;

      // Live Speed calculation (slows on turns, fast on IRR)
      let currentSpeedKmH = Math.round(32 + Math.sin(progress / 5) * 8);
      if (progress < 10) currentSpeedKmH = 22;
      if (progress > 85) currentSpeedKmH = 18;

      // Current Waypoint Street Resolution
      const totalSegments = HIGH_RES_ROUTE.length - 1;
      const normalized = (progress / 100) * totalSegments;
      const currentIndex = Math.min(Math.floor(normalized), totalSegments - 1);
      const segmentProgress = normalized - currentIndex;
      const currentStreet = HIGH_RES_ROUTE[currentIndex]?.street || "Cruising through Bengaluru roads";

      // Milestone text description
      let stageText = "Chef is sealing your piping hot food into thermal insulated wrap...";
      if (progress >= 15 && progress < 35) {
        stageText = "Driver Ramesh picked up your feast! Helmet on, scooter humming...";
      } else if (progress >= 35 && progress < 60) {
        stageText = "Zipping smoothly on Intermediate Ring Road (breezy 38 km/h)...";
      } else if (progress >= 60 && progress < 85) {
        stageText = "Crossing Domlur Flyover & entering 100 Feet Road, Indiranagar...";
      } else if (progress >= 85) {
        stageText = "Ramesh is on Defence Colony lane! Prepare your appetite...";
      }

      // Initialize Leaflet Map
      useEffect(() => {
        if (!mapContainerRef.current) return;

        const map = L.map(mapContainerRef.current, {
          zoomControl: false,
          attributionControl: false
        }).setView([HIGH_RES_ROUTE[0].lat, HIGH_RES_ROUTE[0].lng], 14);

        leafletMapRef.current = map;

        // Warm Carto Voyager tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
          maxZoom: 19
        }).addTo(map);

        // Entire Route Polyline (dashed gray)
        const latLngs = HIGH_RES_ROUTE.map(pt => [pt.lat, pt.lng]);
        L.polyline(latLngs, {
          color: '#E2DACB',
          weight: 6,
          opacity: 0.8
        }).addTo(map);

        // Active Traveled Polyline (vibrant coral)
        completedPolylineRef.current = L.polyline([latLngs[0]], {
          color: '#FA5838',
          weight: 6,
          opacity: 0.95
        }).addTo(map);

        // Origin Restaurant Pin
        const restIcon = L.divIcon({
          html: '<div style="background:#FA5838;padding:8px;border-radius:50%;border:3px solid white;box-shadow:0 6px 14px rgba(250,88,56,0.4);font-size:16px;text-align:center;">🍳</div>',
          className: 'custom-pin',
          iconSize: [36, 36]
        });
        L.marker([HIGH_RES_ROUTE[0].lat, HIGH_RES_ROUTE[0].lng], { icon: restIcon }).addTo(map).bindPopup("Chef's Kitchen (Koramangala)");

        // Destination Home Pin
        const destIcon = L.divIcon({
          html: '<div style="background:#3D7A5A;padding:8px;border-radius:50%;border:3px solid white;box-shadow:0 6px 14px rgba(61,122,90,0.4);font-size:16px;text-align:center;">🏠</div>',
          className: 'custom-pin',
          iconSize: [36, 36]
        });
        L.marker([HIGH_RES_ROUTE[HIGH_RES_ROUTE.length - 1].lat, HIGH_RES_ROUTE[HIGH_RES_ROUTE.length - 1].lng], { icon: destIcon }).addTo(map).bindPopup("Your Home (Indiranagar)");

        // Animated Electric Scooter Icon with Pulsing Beacon
        const scooterIcon = L.divIcon({
          html: `
            <div class="relative flex items-center justify-center">
              <div class="absolute w-12 h-12 rounded-full bg-coral-500/30 pulse-beacon"></div>
              <div style="background:#231A12;color:white;padding:8px;border-radius:50%;border:3px solid #FFC542;box-shadow:0 6px 16px rgba(0,0,0,0.4);font-size:18px;text-align:center;">
                🛵
              </div>
            </div>
          `,
          className: 'custom-scooter',
          iconSize: [44, 44]
        });
        riderMarkerRef.current = L.marker([HIGH_RES_ROUTE[0].lat, HIGH_RES_ROUTE[0].lng], { icon: scooterIcon }).addTo(map);

        return () => {
          map.remove();
        };
      }, []);

      // Real-time Coordinate Interpolation & Camera Following
      useEffect(() => {
        if (!riderMarkerRef.current || !leafletMapRef.current) return;

        const startPt = HIGH_RES_ROUTE[currentIndex];
        const endPt = HIGH_RES_ROUTE[currentIndex + 1] || startPt;

        const currentLat = startPt.lat + (endPt.lat - startPt.lat) * segmentProgress;
        const currentLng = startPt.lng + (endPt.lng - startPt.lng) * segmentProgress;

        // Move Scooter Marker
        riderMarkerRef.current.setLatLng([currentLat, currentLng]);

        // Update traveled polyline
        if (completedPolylineRef.current) {
          const traveledPoints = HIGH_RES_ROUTE.slice(0, currentIndex + 1).map(p => [p.lat, p.lng]);
          traveledPoints.push([currentLat, currentLng]);
          completedPolylineRef.current.setLatLngs(traveledPoints);
        }

        // Smooth camera follow every 5%
        if (Math.round(progress) % 4 === 0) {
          leafletMapRef.current.panTo([currentLat, currentLng], { animate: true, duration: 0.8 });
        }
      }, [progress]);

      return (
        <div className="absolute inset-0 z-40 bg-white flex flex-col animate-float">
          
          {/* Top Live Dashboard Bar */}
          <div className="p-3 bg-white/95 backdrop-blur-md border-b border-[#EDE4D5] z-10 flex items-center justify-between shadow-sm">
            <div>
              <div className="flex items-center gap-1.5">
                <span className="w-2 h-2 rounded-full bg-emerald-500 animate-ping"></span>
                <p className="text-[10px] text-coral-600 font-extrabold uppercase tracking-wider">LIVE COURIER TRACKING</p>
              </div>
              <h2 className="text-sm font-black text-[#231A12]">Ramesh on Ather 450X</h2>
            </div>

            {/* Speed Multipliers (1x Real 2 Min, 2x, 5x, 10x) */}
            <div className="flex items-center gap-1 bg-cream-100 p-1 rounded-xl border border-[#E2DACB]">
              <span className="text-[10px] font-bold text-[#7A6E63] px-1">Speed:</span>
              {[1, 2, 5, 10].map(s => (
                <button
                  key={s}
                  onClick={() => setSpeed(s)}
                  className={`px-2 py-1 rounded-lg text-[10px] font-black transition-all ${
                    speed === s
                      ? 'bg-coral-500 text-white shadow-sm'
                      : 'text-[#5C4F41] hover:bg-cream-200'
                  }`}
                >
                  {s === 1 ? '1x (2m)' : `${s}x`}
                </button>
              ))}
            </div>
          </div>

          {/* Interactive Map Area */}
          <div className="flex-1 w-full relative">
            <div ref={mapContainerRef} className="w-full h-full"></div>

            {/* Floating Live Trip Metrics Overlay (Time & Distance) */}
            <div className="absolute top-3 left-3 right-3 z-[500] space-y-2">
              
              {/* ETA & Distance Glass Card */}
              <div className="bg-white/95 backdrop-blur-md p-3.5 rounded-2xl border border-[#EDE4D5] shadow-pillowy-lg flex items-center justify-between">
                <div>
                  <p className="text-[10px] text-[#7A6E63] font-bold uppercase tracking-wider">Estimated Arrival</p>
                  <p className="text-xl font-black text-coral-600 tracking-tight font-mono">{formattedTime}</p>
                </div>

                <div className="h-8 w-px bg-[#EDE4D5]"></div>

                <div>
                  <p className="text-[10px] text-[#7A6E63] font-bold uppercase tracking-wider">Remaining Distance</p>
                  <p className="text-sm font-black text-[#231A12]">{distanceLabel}</p>
                </div>

                <div className="h-8 w-px bg-[#EDE4D5]"></div>

                <div>
                  <p className="text-[10px] text-[#7A6E63] font-bold uppercase tracking-wider">Current Speed</p>
                  <p className="text-sm font-black text-emerald-600">{currentSpeedKmH} km/h</p>
                </div>
              </div>

              {/* Live Street & Milestone Banner */}
              <div className="bg-[#231A12]/90 backdrop-blur-md px-3.5 py-2 rounded-xl text-white shadow-md flex items-center justify-between text-xs">
                <div className="flex items-center gap-2 overflow-hidden pr-2">
                  <span className="text-coral-400 text-sm animate-bounce">📍</span>
                  <div className="truncate">
                    <p className="text-[10px] text-honey-400 font-bold uppercase truncate">{currentStreet}</p>
                    <p className="text-[11px] font-medium text-stone-200 truncate">{stageText}</p>
                  </div>
                </div>
                <span className="text-xs font-black text-honey-400 bg-white/10 px-2 py-0.5 rounded-md whitespace-nowrap">
                  {Math.round(progress)}%
                </span>
              </div>

            </div>

            {/* Recenter Button */}
            <button
              onClick={() => {
                if (leafletMapRef.current && riderMarkerRef.current) {
                  leafletMapRef.current.setView(riderMarkerRef.current.getLatLng(), 15, { animate: true });
                }
              }}
              className="absolute bottom-3 right-3 z-[500] bg-white hover:bg-cream-50 text-[#231A12] font-bold text-xs p-2.5 rounded-2xl shadow-pillowy border border-[#EDE4D5] flex items-center gap-1.5 active:scale-95 transition-all"
            >
              <span>🎯 Center Rider</span>
            </button>

          </div>

          {/* Bottom Driver Card */}
          <div className="p-3.5 bg-white border-t border-[#EDE4D5] flex items-center justify-between shadow-pillowy">
            <div className="flex items-center space-x-3">
              <div className="w-12 h-12 rounded-2xl bg-cream-100 border border-[#EDE4D5] flex items-center justify-center text-2xl shadow-sm">
                👨‍✈️
              </div>
              <div>
                <div className="flex items-center gap-1.5">
                  <h4 className="font-black text-[#231A12] text-xs">Ramesh Kumar</h4>
                  <span className="text-[10px] bg-honey-100 text-honey-600 px-1.5 py-0.5 rounded font-black">★ 4.9</span>
                </div>
                <p className="text-[11px] text-[#7A6E63] font-medium">Ather 450X (Electric) • KA-03-HA-4412</p>
              </div>
            </div>

            <button
              onClick={() => showToast(`📞 Ramesh: "Cruising along ${currentStreet}! I will be there in about ${minutes}m ${seconds}s!"`)}
              className="bg-cream-100 hover:bg-cream-200 text-[#382F26] px-3.5 py-2 rounded-xl text-xs font-bold border border-[#E2DACB] flex items-center gap-1.5 transition-all shadow-sm"
            >
              <span>📞</span>
              <span>Call Rider</span>
            </button>
          </div>

        </div>
      );
    }

    // --- Joyful Arrival & Dopamine Summary Modal ---
    function CelebrationModal({ data, onReset, showToast }) {
      const handleShareReceipt = () => {
        const text = `✨ Cravingly Dopamine Receipt:
🎉 Craving Satisfied: 100%
💰 Money Saved: ₹${data?.savedAmount || 0}
🥗 Calories Dodged: ${data?.avoidedCalories || 0} kcal
Guilt: 0% | Serotonin: Overload
Enjoyed with Cravingly!`;
        navigator.clipboard.writeText(text);
        showToast("📋 Cravingly receipt copied to clipboard!");
      };

      return (
        <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-white border border-[#E8DFC8] w-full max-w-sm rounded-3xl p-6 text-center space-y-4 shadow-2xl animate-float">
            
            <div className="w-20 h-20 mx-auto rounded-3xl bg-sage-50 border-2 border-sage-500/30 flex items-center justify-center text-4xl shadow-inner">
              ✨🍽️
            </div>

            <div className="space-y-1.5">
              <h2 className="text-xl font-black text-[#231A12] font-serif">Your Craving Has Been Satisfied!</h2>
              <p className="text-xs text-[#6B5E51] leading-relaxed">
                You experienced the full, delicious psychological joy of choosing toppings, ordering, and watching your rider navigate Bengaluru with <strong className="text-sage-600">zero money spent</strong> and <strong className="text-coral-600">zero calories gained</strong>.
              </p>
            </div>

            <div className="grid grid-cols-2 gap-2.5 py-1">
              <div className="bg-sage-50 border border-sage-200 p-3 rounded-2xl text-center">
                <span className="text-[10px] text-sage-600 font-extrabold uppercase">Money Saved</span>
                <p className="text-xl font-black text-emerald-600">₹{data?.savedAmount || 0}</p>
                <p className="text-[9px] text-sage-500 font-bold">100% Happy Hour</p>
              </div>

              <div className="bg-honey-50 border border-honey-200 p-3 rounded-2xl text-center">
                <span className="text-[10px] text-honey-600 font-extrabold uppercase">Calories Dodged</span>
                <p className="text-xl font-black text-honey-600">{data?.avoidedCalories || 0}</p>
                <p className="text-[9px] text-honey-600 font-bold">Guilt-Free Bliss</p>
              </div>
            </div>

            <div className="space-y-2 pt-2">
              <button
                onClick={onReset}
                className="w-full bg-coral-500 hover:bg-coral-600 text-white font-black py-3 rounded-2xl text-xs shadow-warm-glow active:scale-95 transition-all"
              >
                Satisfy Another Craving 🍕
              </button>

              <button
                onClick={handleShareReceipt}
                className="w-full bg-cream-100 hover:bg-cream-200 text-[#4A3E31] font-bold py-2.5 rounded-2xl text-xs border border-[#E2DACB] active:scale-95 transition-all"
              >
                📋 Share Dopamine Receipt
              </button>
            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CravinglyApp />);
  </script>
</body>
</html>
