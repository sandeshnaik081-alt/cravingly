    // --- Web Audio API Chime (659Hz E5 -> 523Hz C5) ---
    function playWarmDoorbellChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();

        // 1st note: E5 (659.25Hz) - bright cheerful greeting
        const osc1 = ctx.createOscillator();
        const gain1 = ctx.createGain();
        osc1.type = 'triangle';
        osc1.frequency.setValueAtTime(659.25, ctx.currentTime);
        gain1.gain.setValueAtTime(0.35, ctx.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
        osc1.connect(gain1);
        gain1.connect(ctx.destination);
        osc1.start(ctx.currentTime);
        osc1.stop(ctx.currentTime + 0.9);

        // 2nd note: C5 (523.25Hz) - deep warm resolution
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(523.25, ctx.currentTime + 0.35);
        gain2.gain.setValueAtTime(0.35, ctx.currentTime + 0.35);
        gain2.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.5);
        osc2.connect(gain2);
        gain2.connect(ctx.destination);
        osc2.start(ctx.currentTime + 0.35);
        osc2.stop(ctx.currentTime + 1.5);
      } catch (err) {
        console.warn("Audio note played in silence:", err);
      }
    }

    function CravinglyApp() {
      // Lifetime metrics stored in localStorage
      const [metrics, setMetrics] = useState(() => {
        try {
          const stored = localStorage.getItem('cravingly_lifetime_metrics');
          return stored ? JSON.parse(stored) : { moneySaved: 2340, caloriesAvoided: 4890, ordersCompleted: 3 };
        } catch {
          return { moneySaved: 2340, caloriesAvoided: 4890, ordersCompleted: 3 };
        }
      });

      useEffect(() => {
        try {
          localStorage.setItem('cravingly_lifetime_metrics', JSON.stringify(metrics));
        } catch {}
      }, [metrics]);

      // Category and navigation
      const [activeCategory, setActiveCategory] = useState('All');
      const [customizingItem, setCustomizingItem] = useState(null);
      
      // Cart & Checkout State
      const [cart, setCart] = useState([]);
      const [isCartOpen, setIsCartOpen] = useState(false);
      const [deliveryNote, setDeliveryNote] = useState("Leave outside, ring the bell and do a happy dance");
      const [toastMsg, setToastMsg] = useState(null);

      // Tracking & Climax
      const [isTracking, setIsTracking] = useState(false);
      const [trackingProgress, setTrackingProgress] = useState(0);
      const [speedMultiplier, setSpeedMultiplier] = useState(1);
      const [showCelebration, setShowCelebration] = useState(false);
      const [lastOrderDetails, setLastOrderDetails] = useState(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3600);
      };

      // Filtered Dishes
      const filteredFood = activeCategory === 'All'
        ? FOOD_MENU
        : FOOD_MENU.filter(item => item.category === activeCategory);

      // Bill calculations
      const subtotal = cart.reduce((acc, item) => acc + (item.totalPrice * item.quantity), 0);
      const deliveryFee = cart.length > 0 ? 45 : 0;
      const platformFee = cart.length > 0 ? 10 : 0;
      const taxes = cart.length > 0 ? Math.round(subtotal * 0.05) : 0;
      const originalGrandTotal = subtotal + deliveryFee + platformFee + taxes;

      // Add to cart from Customizer
      const handleAddCustomizedItem = (dishData) => {
        setCart(prev => {
          const idx = prev.findIndex(item => item.id === dishData.id && JSON.stringify(item.customs) === JSON.stringify(dishData.customs));
          if (idx > -1) {
            const copy = [...prev];
            copy[idx].quantity += 1;
            return copy;
          }
          return [...prev, { ...dishData, quantity: 1 }];
        });
        setCustomizingItem(null);
        showToast(`✨ Added "${dishData.name}" to your craving bag!`);
      };

      // Update item quantity in cart
      const handleUpdateQty = (index, delta) => {
        setCart(prev => {
          const copy = [...prev];
          copy[index].quantity += delta;
          if (copy[index].quantity <= 0) {
            return copy.filter((_, i) => i !== index);
          }
          return copy;
        });
      };

      // Start live order tracking
      const handlePlaceOrder = () => {
        if (cart.length === 0) return;
        setIsCartOpen(false);
        setIsTracking(true);
        setTrackingProgress(0);
        setSpeedMultiplier(1);
      };

      // Progress animation loop for driver
      useEffect(() => {
        if (!isTracking) return;
        const interval = setInterval(() => {
          setTrackingProgress(prev => {
            const next = prev + (1.2 * speedMultiplier);
            if (next >= 100) {
              clearInterval(interval);
              triggerArrival();
              return 100;
            }
            return next;
          });
        }, 150);
        return () => clearInterval(interval);
      }, [isTracking, speedMultiplier]);

      // When scooter arrives
      const triggerArrival = () => {
        playWarmDoorbellChime();
        if (window.confetti) {
          window.confetti({
            particleCount: 140,
            spread: 80,
            origin: { y: 0.6 },
            colors: ['#FA5838', '#F5A623', '#3D7A5A', '#FF7D66', '#FFD166']
          });
        }

        const totalCalories = cart.reduce((sum, item) => sum + (item.calories * item.quantity), 0);
        const orderSummary = {
          savedAmount: originalGrandTotal,
          avoidedCalories: totalCalories || 850,
          totalItems: cart.reduce((s, i) => s + i.quantity, 0)
        };

        setMetrics(prev => ({
          moneySaved: prev.moneySaved + orderSummary.savedAmount,
          caloriesAvoided: prev.caloriesAvoided + orderSummary.avoidedCalories,
          ordersCompleted: prev.ordersCompleted + 1
        }));

        setLastOrderDetails(orderSummary);
        setShowCelebration(true);
        setIsTracking(false);
      };

      // Reset for next craving
      const handleResetOrder = () => {
        setShowCelebration(false);
        setCart([]);
        setTrackingProgress(0);
      };

      return (
        <div className="w-full max-w-md bg-white border border-[#EBE3D5] rounded-none sm:rounded-3xl shadow-pillowy-lg overflow-hidden flex flex-col min-h-screen sm:min-h-[890px] relative">

            {/* Lifetime Savings Counter */}
            <div className="flex items-center gap-1.5">

              </div>
              <div className="bg-white border border-[#E8DFC8] px-2.5 py-1 rounded-xl text-right shadow-sm">
                <p className="text-[8px] uppercase tracking-wider text-honey-600 font-extrabold">Avoided</p>
                <p className="text-xs font-black text-honey-600">{metrics.caloriesAvoided} kcal</p>
              </div>
            </div>
          </header>

          {/* Toast Notification */}
          {toastMsg && (
            <div className="absolute top-16 left-4 right-4 z-50 bg-[#2D251E] text-white text-xs px-4 py-3 rounded-2xl shadow-xl border border-white/10 flex items-center justify-between animate-float">

              <button onClick={() => setToastMsg(null)} className="ml-2 text-stone-400 hover:text-white font-bold">✕</button>

    // --- Interactive Leaflet.js Map Tracker Component ---
    function MapTracker({ progress, speed, setSpeed, showToast }) {
      const mapContainerRef = useRef(null);
      const leafletMapRef = useRef(null);
      const riderMarkerRef = useRef(null);

      useEffect(() => {
        if (!mapContainerRef.current) return;

        // Initialize Leaflet map with smooth warm tiles
        const map = L.map(mapContainerRef.current, {
          zoomControl: false,
          attributionControl: false
        }).setView([12.956, 77.633], 13);

        leafletMapRef.current = map;

        // Carto Voyager warm clean map tiles
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
          maxZoom: 19
        }).addTo(map);

        // Restaurant Pin
        const restIcon = L.divIcon({
          html: '<div style="background:#FA5838;padding:8px;border-radius:50%;border:3px solid white;box-shadow:0 6px 14px rgba(250,88,56,0.4);font-size:16px;text-align:center;">🍳</div>',
          className: 'custom-pin',
          iconSize: [36, 36]
        });
        L.marker(BENGALURU_ROUTE[0], { icon: restIcon }).addTo(map).bindPopup("Chef's Kitchen (Koramangala)");

        // Destination Home Pin
        const destIcon = L.divIcon({
          html: '<div style="background:#3D7A5A;padding:8px;border-radius:50%;border:3px solid white;box-shadow:0 6px 14px rgba(61,122,90,0.4);font-size:16px;text-align:center;">🏠</div>',
          className: 'custom-pin',
          iconSize: [36, 36]
        });
        L.marker(BENGALURU_ROUTE[BENGALURU_ROUTE.length - 1], { icon: destIcon }).addTo(map).bindPopup("Your Cozy Home (Indiranagar)");

        // Route Polyline
        L.polyline(BENGALURU_ROUTE, {
          color: '#FA5838',
          weight: 5,
          opacity: 0.85,
          dashArray: '8, 8'
        }).addTo(map);

        // Electric Scooter Marker
        const scooterIcon = L.divIcon({
          html: '<div style="background:#231A12;color:white;padding:7px;border-radius:50%;border:3px solid #FFC542;box-shadow:0 6px 16px rgba(0,0,0,0.3);font-size:16px;text-align:center;">🛵</div>',
          className: 'custom-scooter',
          iconSize: [38, 38]
        });
        riderMarkerRef.current = L.marker(BENGALURU_ROUTE[0], { icon: scooterIcon }).addTo(map);

        return () => {
          map.remove();
        };
      }, []);

      // Interpolate rider location
      useEffect(() => {
        if (!riderMarkerRef.current || !leafletMapRef.current) return;

        const totalSegments = BENGALURU_ROUTE.length - 1;
        const normalized = (progress / 100) * totalSegments;
        const index = Math.min(Math.floor(normalized), totalSegments - 1);
        const segmentProgress = normalized - index;

        const start = BENGALURU_ROUTE[index];
        const end = BENGALURU_ROUTE[index + 1] || start;

        const currentLat = start[0] + (end[0] - start[0]) * segmentProgress;
        const currentLng = start[1] + (end[1] - start[1]) * segmentProgress;

        riderMarkerRef.current.setLatLng([currentLat, currentLng]);
      }, [progress]);

      // Dynamic milestone copy
      let stageText = "Chef is putting love into the packaging...";
      if (progress >= 25 && progress < 50) {
        stageText = "Driver Ramesh just picked up your feast!";
      } else if (progress >= 50 && progress < 80) {
        stageText = "Electric scooter is zipping through 100ft road traffic...";
      } else if (progress >= 80) {
        stageText = "Turning onto your street! Prepare your appetite...";
      }

      return (
        <div className="absolute inset-0 z-40 bg-white flex flex-col">
          
          {/* Header */}
          <div className="p-3.5 bg-white/95 backdrop-blur border-b border-[#EDE4D5] z-10 flex items-center justify-between shadow-sm">
            <div>
              <p className="text-[10px] text-coral-600 font-extrabold uppercase tracking-wider">LIVE COURIER TRACKING</p>
              <h2 className="text-sm font-black text-[#231A12]">Ramesh on Ather 450X</h2>
            </div>

            {/* Fast Forward Speed Button */}
            <button
              onClick={() => setSpeed(s => s === 1 ? 2 : s === 2 ? 5 : 1)}
              className="bg-honey-50 border border-honey-500/40 text-honey-600 font-black px-3 py-1.5 rounded-xl text-xs hover:bg-honey-100 transition-all flex items-center gap-1 shadow-sm"
            >
              <span>⚡ Fast-Forward</span>
              <span>{speed}x</span>
            </button>
          </div>

          {/* Real Leaflet Map */}
          <div className="flex-1 w-full relative">
            <div ref={mapContainerRef} className="w-full h-full"></div>

            {/* Floating Live Progress Status Card */}
            <div className="absolute top-4 left-4 right-4 z-[500] bg-white/95 backdrop-blur-md p-3.5 rounded-2xl border border-[#EDE4D5] shadow-pillowy-lg">
              <div className="flex justify-between items-center text-xs mb-1.5">
                <span className="font-extrabold text-[#231A12]">Delivery Progress</span>
                <span className="font-black text-coral-600">{Math.round(progress)}%</span>
              </div>
              <div className="w-full bg-cream-200 h-2.5 rounded-full overflow-hidden">
                <div 
                  className="bg-gradient-to-r from-honey-500 via-coral-500 to-coral-600 h-full transition-all duration-150 rounded-full"
                  style={{ width: `${progress}%` }}
                ></div>
              </div>
              <p className="text-xs text-[#4A3E31] font-bold mt-2 flex items-center gap-1.5">
                <span>📍</span>
                <span>{stageText}</span>
              </p>
            </div>
          </div>

          {/* Bottom Driver Profile Card */}
          <div className="p-4 bg-white border-t border-[#EDE4D5] flex items-center justify-between shadow-pillowy">
            <div className="flex items-center space-x-3">
              <div className="w-12 h-12 rounded-2xl bg-cream-100 border border-[#EDE4D5] flex items-center justify-center text-2xl shadow-sm">
                👨‍✈️
              </div>
              <div>
                <div className="flex items-center gap-1.5">
                  <h4 className="font-black text-[#231A12] text-xs">Ramesh Kumar</h4>
                  <span className="text-[10px] bg-honey-100 text-honey-600 px-1.5 py-0.5 rounded font-black">★ 4.9</span>
                </div>
                <p className="text-[11px] text-[#7A6E63] font-medium">Electric Scooter • KA-03-HA-4412</p>
              </div>
            </div>

            <button
              onClick={() => showToast("📞 Ramesh: 'I am right at your doorstep! Enjoy this 100% guilt-free feast!'")}
              className="bg-cream-100 hover:bg-cream-200 text-[#382F26] px-3.5 py-2 rounded-xl text-xs font-bold border border-[#E2DACB] flex items-center gap-1.5 transition-all shadow-sm"
            >
              <span>📞</span>
              <span>Call Rider</span>
            </button>
          </div>

        </div>
      );
    }
